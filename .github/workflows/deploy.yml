name: Check Swoffers source access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read public Swoffers source pages
        run: |
          mkdir source-check
          node --use-system-ca <<'NODE'
          const fs=require('node:fs/promises');
          const {robotsAllows}=require('./collector.cjs');
          const origin='https://swoffers.co.uk';
          async function read(route){const r=await fetch(origin+route,{headers:{'User-Agent':'GuernseyPropertyFinder/1.0 (private property search; low-frequency collector)'},signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error(r.status+' '+route);return r.text()}
          (async()=>{const robots=await read('/robots.txt');console.log(robots);await fs.writeFile('source-check/robots.txt',robots);for(const [name,route] of [['index','/property-search?market=local-sales'],['detail','/property/2-tropicana-bungalows-ruette-de-la-tour-castel']]){if(!robotsAllows(robots,route))throw Error('Robots disallows '+route);await new Promise(r=>setTimeout(r,1000));const html=await read(route);await fs.writeFile('source-check/'+name+'.html',html);console.log(name,html.length)}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swoffers-source-check
          path: source-check
